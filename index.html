<h1 style="text-align: center; margin-top: 10px; position: absolute; top: 20px">Aspect Ratio Calculator</h1>


<body style="margin: 0; min-height: 75vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; font-family: sans-serif;">


  <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
    <div style="display: flex; gap: 10px; align-items: center;">
      <input type="number" id="width-input" placeholder="Width" style="padding: 8px; width: 80px;">
      <span>x</span>
      <input type="number" id="height-input" placeholder="Height" style="padding: 8px; width: 80px;">
    </div>
    <button id="calculate-btn" style="padding: 8px 16px; background-color: #0a005f; color: white; border: none; cursor: pointer; font-weight: bold;">Calculate</button>
    <p id="result" aria-live="polite"></p>
  </div>

  <script src="script.js"></script>
